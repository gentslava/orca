name: Personal upstream + PR build
run-name: Personal build - ${{ inputs.audit_only && 'audit' || 'packages' }} - ${{ github.run_number }}

on:
  pull_request:
    branches: [master]
    paths:
      - AGENTS.md
      - config/fork-build/**
      - .github/dependabot.yml
      - .github/workflows/fork-preview-macos-arm64.yml
      - .github/workflows/personal-build.yml
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      audit_only:
        description: Resolve lifecycle and merge every selection without packaging
        type: boolean
        default: false
      force_build:
        description: Package even if the last successful release has identical inputs
        type: boolean
        default: false
      upstream_commit:
        description: Optional full upstream commit for a fixed build; empty follows latest main
        type: string
        default: ''
      macos_runner:
        description: Hosted ARM64 image for the macOS release lane
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
      macos_sign_tree:
        description: Exact reviewed composition tree for an authorized Developer ID release
        type: string
        default: ''
      tested_run:
        description: Optional successful fork qualification run for the identical source tree
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group:
    personal-upstream-pr-build-${{ github.event_name == 'pull_request' && github.event.pull_request.number ||
    (github.event_name == 'workflow_dispatch' && (inputs.audit_only || github.ref != 'refs/heads/master')) && format('qualification-{0}', github.ref_name) || 'release' }}
  cancel-in-progress: false

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_RELEASE_JAVASCRIPT_BUILD_IDENTITY: dev
  ORCA_DIAGNOSTICS_TOKEN_URL: https://www.onorca.dev/diagnostics/token

jobs:
  plan:
    if: >-
      github.repository == 'gentslava/orca' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.compose.outputs.build }}
      receipt: ${{ steps.compose.outputs.receipt }}
      tag: ${{ steps.compose.outputs.tag }}
      source: ${{ steps.compose.outputs.source }}
      upstream: ${{ steps.compose.outputs.upstream }}
      linux_matrix: ${{ steps.compose.outputs.linux_matrix }}
      plan_artifact_id: ${{ steps.upload-plan.outputs.artifact-id }}
      full_suite_reused: ${{ steps.qualification.outputs.full_suite_reused }}
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test composition policy with real Git fixtures
        run: node --test config/fork-build/*.test.mjs
      - name: Freeze upstream and PR identities; compose required selection
        id: compose
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_ONLY: ${{ inputs.audit_only || false }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
          FORK_BUILD_UPSTREAM_COMMIT: ${{ inputs.upstream_commit || '' }}
          FORK_MAC_SIGN_TREE: ${{ inputs.macos_sign_tree || '' }}
          FORK_MAC_SIGN_TEAM_ID: ${{ vars.ORCA_FORK_MAC_TEAM_ID }}
        run: node config/fork-build/plan.mjs
      - name: Verify prior qualification for this exact source tree
        id: qualification
        if: inputs.tested_run && steps.compose.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_RUN: ${{ inputs.tested_run }}
        run: node config/fork-build/qualification-reuse.mjs "$TESTED_RUN" personal-build
      - name: Preserve the exact plan and report even on conflict
        id: upload-plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: personal-source-plan-${{ github.run_attempt }}
          path: personal-build/
          if-no-files-found: error
          retention-days: 14

  javascript:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      artifact_id: ${{ steps.upload-javascript.outputs.artifact-id }}
    env:
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
      ORCA_RELEASE_JAVASCRIPT_SOURCE_SHA: ${{ needs.plan.outputs.source }}
      ORCA_CLI_BUILD_COMPILER: tsrs
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - &checkout-control
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - *node
      - &source-plan
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: personal-build
      - name: Restore the immutable source for the shared JavaScript bundle
        run: |
          mv control "$RUNNER_TEMP/personal-control"
          node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" prepare personal-build/plan.json "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Install Electron package binary for upstream unit tests
        run: node config/scripts/electron-installation/platform-layout/install-electron-package-binary.mjs
      - name: Verify formatting, localization and changed source
        run: node "$RUNNER_TEMP/personal-control/config/fork-build/qualification.mjs" personal-build/plan.json "$GITHUB_WORKSPACE"
      - name: Typecheck the composed source
        if: needs.plan.outputs.full_suite_reused != 'true'
        run: pnpm run typecheck:ci --bun-concurrency=2 --bun-threads=2
      - name: Lint the composed source
        if: needs.plan.outputs.full_suite_reused != 'true'
        env:
          ORCA_CODE_QUALITY_BASE: ${{ needs.plan.outputs.upstream }}
          ORCA_FORK_BUILD_CONTROL_ROOT: ${{ runner.temp }}/personal-control
        run: pnpm run lint
      - name: Fetch the upstream release fixtures for cross-version tests
        if: needs.plan.outputs.full_suite_reused != 'true'
        run: |
          baseline="$(node -p 'require("./personal-build/plan.json").upstreamRelease.tag')"
          [[ "$baseline" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags https://github.com/stablyai/orca.git \
            "refs/tags/$baseline:refs/tags/$baseline" \
            refs/tags/v1.4.199:refs/tags/v1.4.199
      - name: Install headless Chromium for mobile bundle regressions
        if: needs.plan.outputs.full_suite_reused != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run desktop and mobile unit tests
        if: needs.plan.outputs.full_suite_reused != 'true'
        env:
          ORCA_MOBILE_WEB_APP_DEPS_REQUIRED: '1'
        run: |
          pnpm --dir mobile test --maxWorkers=2
          pnpm test --maxWorkers=2
      - name: Build shared JavaScript with upstream tooling
        run: |
          pnpm run build:release:javascript:parallel
          node config/scripts/release/javascript-artifacts/release-javascript-artifact.mjs pack
      - id: upload-javascript
        uses: actions/upload-artifact@v7
        with:
          name: personal-javascript
          path: .build/release-javascript/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: [plan, javascript]
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/master'
    runs-on: ${{ inputs.macos_runner == 'macos-15' && 'macos-15' || 'macos-26' }}
    timeout-minutes: 120
    environment: ${{ inputs.macos_sign_tree && 'fork-macos-signing' || 'fork-macos-preview' }}
    env:
      ORCA_RELEASE_JAVASCRIPT_SOURCE_SHA: ${{ needs.plan.outputs.source }}
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
      ORCA_MAC_RELEASE: '0'
      ORCA_MAC_HOURLY: '0'
      ORCA_MAC_DAILY: '0'
      ORCA_MAC_ADHOC: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_NAME: '-'
      ORCA_COMPUTER_MACOS_SIGN_IDENTITY: '-'
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
    steps:
      - *checkout-control
      - *node
      - *source-plan
      - name: Select the installed Xcode 26 toolchain on macOS 15
        if: inputs.macos_runner == 'macos-15'
        run: |
          set -euo pipefail
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.*.app' | sort -V | tail -n 1)
          test -n "$xcode"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -version
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Restore the frozen source and require native ARM64
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mv control "$RUNNER_TEMP/personal-control"
          node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" prepare personal-build/plan.json "$GITHUB_WORKSPACE"
          printf 'ORCA_USER_DATA_PATH=%s/primary-profile\nORCA_USER_DATA=%s/server-profile\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install composed dependencies with read-only repository permissions
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          persist-native-cache: 'false'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Qualify formatting and source quality of the exact composition
        run: node "$RUNNER_TEMP/personal-control/config/fork-build/qualification.mjs" personal-build/plan.json "$GITHUB_WORKSPACE"
      - &javascript-artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.javascript.outputs.artifact_id }}
          path: .build/release-javascript
      - name: Build desktop, CLI, web and mobile resources
        run: |
          node config/scripts/release/javascript-artifacts/release-javascript-artifact.mjs restore
          pnpm run build:release:host
      - name: Verify regressions from all composed features
        if: needs.plan.outputs.full_suite_reused != 'true'
        run: node "$RUNNER_TEMP/personal-control/config/fork-build/regressions.mjs" personal-build/plan.json "$GITHUB_WORKSPACE"
      - name: Verify fork updater policy against the composed application
        env:
          ORCA_TEST_COMPOSED_FORK_UPDATER: '1'
        run: |
          set -euo pipefail
          test ! -e src/main/updater.fork-preview.test.ts
          cp "$RUNNER_TEMP/personal-control/src/main/updater.fork-preview.test.ts" src/main/updater.fork-preview.test.ts
          trap 'rm -f src/main/updater.fork-preview.test.ts' EXIT
          pnpm exec vitest run --config config/vitest.config.ts src/main/updater.fork-preview.test.ts --maxWorkers=1
      - name: Build and verify native helpers
        run: |
          set -euo pipefail
          pnpm run build:native
          pnpm run verify:computer-native
      - name: Prepare pinned ARM64 packaging runtimes
        run: |
          node config/scripts/orcad-distribution/prebuilds/pinned-node-downloads.mjs darwin-arm64
          pnpm run ensure:electron-runtime
      - name: Package ad hoc ARM64 DMG and ZIP
        if: '!inputs.macos_sign_tree'
        run: |
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dmg zip --arm64 --config.mac.identity=- --publish never
      - name: Sign and notarize the reviewed ARM64 DMG and ZIP
        if: github.event_name == 'workflow_dispatch' && inputs.macos_sign_tree != ''
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.ORCA_FORK_MAC_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          ORCA_MAC_RELEASE: '1'
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing MAC_CERTS}" "${CSC_KEY_PASSWORD:?Missing MAC_CERTS_PASSWORD}"
          : "${APPLE_ID:?Missing APPLE_ID}" "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          ORCA_FORK_MAC_TEAM_ID="$(node -p 'require("./personal-build/plan.json").macosTeamId || ""')"
          [[ -n "$ORCA_FORK_MAC_TEAM_ID" && "$ORCA_FORK_MAC_TEAM_ID" == "$APPLE_TEAM_ID" ]]
          export ORCA_FORK_MAC_TEAM_ID
          unset CSC_NAME ORCA_COMPUTER_MACOS_SIGN_IDENTITY
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dmg zip --arm64 --publish never
      - name: Measure archives against the exact source and stage downloads
        run: node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" stage personal-build/plan.json "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        with:
          name: personal-package-macos-arm64
          path: personal-packages/
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [plan, javascript]
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ORCA_RELEASE_JAVASCRIPT_SOURCE_SHA: ${{ needs.plan.outputs.source }}
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - *checkout-control
      - *node
      - *source-plan
      - name: Restore the shared source plan on Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Windows x64 is required' }
          Move-Item control "$env:RUNNER_TEMP/personal-control"
          node "$env:RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" prepare personal-build/plan.json "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ORCA_USER_DATA_PATH=$env:RUNNER_TEMP/primary-profile" >> $env:GITHUB_ENV
          "ORCA_USER_DATA=$env:RUNNER_TEMP/server-profile" >> $env:GITHUB_ENV
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          persist-native-cache: 'false'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Verify fork updater guard on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'src/main/updater.fork-preview.test.ts'
          if (Test-Path $test) { throw 'Refusing to overwrite a source test' }
          Copy-Item "$env:RUNNER_TEMP/personal-control/$test" $test
          try {
            pnpm exec vitest run --config config/vitest.config.ts $test --maxWorkers=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item $test }
      - *javascript-artifact
      - name: Build existing Windows release resources and native helpers
        shell: pwsh
        run: |
          node config/scripts/release/javascript-artifacts/release-javascript-artifact.mjs restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build:release:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run ensure:electron-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package unsigned installer and portable ZIP
        shell: pwsh
        run: |
          node "$env:RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" stamp-windows personal-build/plan.json "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config "$env:RUNNER_TEMP/personal-control/config/fork-build/windows-builder.config.cjs" --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config "$env:RUNNER_TEMP/personal-control/config/fork-build/windows-builder.config.cjs" --win zip --x64 --prepackaged dist/win-unpacked --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/personal-control/config/fork-build/extract-windows-packages.ps1" -Packages dist -Verification "$env:RUNNER_TEMP/windows-stage"
          node "$env:RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" stage-windows personal-build/plan.json "$env:GITHUB_WORKSPACE" "$env:RUNNER_TEMP/windows-stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: personal-package-windows-x64
          path: personal-packages/
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    needs: [plan, windows]
    if: needs.windows.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - *checkout
      - *node
      - *source-plan
      - uses: actions/download-artifact@v8
        with:
          name: personal-package-windows-x64
          path: windows-packages
      - name: Re-extract and verify both Windows downloads with trusted code
        shell: pwsh
        run: |
          & ./config/fork-build/extract-windows-packages.ps1 -Packages windows-packages -Verification "$env:RUNNER_TEMP/windows-verify"
          node config/fork-build/packages.mjs verify-windows personal-build/plan.json windows-packages "$env:RUNNER_TEMP/windows-verify"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: personal-package-windows-verification
          path: windows-packages/windows-verified.json
          if-no-files-found: error
          retention-days: 14

  android:
    needs: plan
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
    steps:
      - *checkout-control
      - *node
      - *source-plan
      - name: Restore the shared source and require the existing debug signing policy
        env:
          RELEASE_CERTIFICATE: ${{ vars.ORCA_ANDROID_RELEASE_CERT_SHA256 }}
          REQUIRE_RELEASE_SIGNING: ${{ vars.ORCA_ANDROID_REQUIRE_RELEASE_SIGNING }}
        run: |
          set -euo pipefail
          test -z "$RELEASE_CERTIFICATE"
          case "${REQUIRE_RELEASE_SIGNING,,}" in
            1|true|yes|on) echo '::error::Production signing is required; the debug APK lane is blocked'; exit 1 ;;
          esac
          mv control "$RUNNER_TEMP/personal-control"
          node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" prepare personal-build/plan.json "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-pnpm
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Check committed mobile release version
        working-directory: mobile
        env:
          MOBILE_ANDROID_PUBLISH_RELEASE: 'false'
        run: node scripts/prepare-android-release.mjs
      - &java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate existing Expo Android project
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Embed the same source receipt as the desktop packages
        run: node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" stamp-android personal-build/plan.json "$GITHUB_WORKSPACE"
      - name: Build the release APK with the existing Expo debug key
        working-directory: mobile/android
        run: ORCA_FORK_ANDROID_BUILD_VERSION="$ORCA_LOCAL_BUILD_VERSION" ./gradlew assembleRelease --no-daemon
      - name: Verify APK identity, architecture and signing certificate
        run: node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" stage-android personal-build/plan.json "$GITHUB_WORKSPACE"
      - name: Preserve a rejected APK for signing diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: personal-android-rejected
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: personal-package-android
          path: personal-packages/
          if-no-files-found: error
          retention-days: 14

  verify-android:
    needs: [plan, android]
    if: needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *java
      - *source-plan
      - uses: actions/download-artifact@v8
        with:
          name: personal-package-android
          path: android-packages
      - name: Independently verify the APK with the Android SDK
        run: node config/fork-build/packages.mjs verify-android personal-build/plan.json android-packages
      - uses: actions/upload-artifact@v7
        with:
          name: personal-package-android-verification
          path: android-packages/android-verified.json
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: [plan, javascript]
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
      ORCA_RELEASE_JAVASCRIPT_SOURCE_SHA: ${{ needs.plan.outputs.source }}
      ORCA_LINUX_BUILD_ARCH: ${{ matrix.architecture }}
      ORCA_LINUX_ARM64_RELEASE: ${{ matrix.architecture == 'arm64' && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - *checkout-control
      - *node
      - *source-plan
      - name: Restore the same planned source on its native Linux architecture
        run: |
          test "$(node -p process.arch)" = "$ORCA_LINUX_BUILD_ARCH"
          mv control "$RUNNER_TEMP/personal-control"
          node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" prepare personal-build/plan.json "$GITHUB_WORKSPACE"
          node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" stamp-linux personal-build/plan.json "$GITHUB_WORKSPACE" "$ORCA_LINUX_BUILD_ARCH"
      - name: Install upstream Linux provider and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm cpio binutils
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          persist-native-cache: 'false'
      - uses: ./.github/actions/install-mobile-dependencies
      - *javascript-artifact
      - name: Restore upstream JavaScript and build native host resources
        run: |
          node config/scripts/release/javascript-artifacts/release-javascript-artifact.mjs restore
          pnpm run build:release:host
          pnpm run ensure:electron-runtime
      - name: Package the upstream AppImage, DEB and RPM targets
        env:
          APP_DIRECTORY: ${{ matrix.architecture == 'arm64' && 'dist/linux-arm64-unpacked' || 'dist/linux-unpacked' }}
        run: |
          configuration="$RUNNER_TEMP/personal-control/config/fork-build/linux-builder.config.cjs"
          pnpm exec electron-builder --config "$configuration" --linux dir "--$ORCA_LINUX_BUILD_ARCH" --publish never
          node "$RUNNER_TEMP/personal-control/config/fork-build/linux-packaging.mjs" "$ORCA_LINUX_BUILD_ARCH"
      - name: Verify packaged PTY loading on the supported glibc floor
        env:
          ORCA_NODE_PTY_FLOOR_APT_MIRROR: ${{ matrix.architecture == 'x64' && 'http://azure.archive.ubuntu.com/ubuntu' || '' }}
          APP_DIRECTORY: ${{ matrix.architecture == 'arm64' && 'dist/linux-arm64-unpacked' || 'dist/linux-unpacked' }}
        run: timeout --kill-after=30s 8m node config/scripts/desktop-distribution/runtime-verification/run-linux-packaged-node-pty-floor-smoke.mjs --app-dir "$APP_DIRECTORY"
      - name: Extract and measure every Linux format against its source receipt
        run: node "$RUNNER_TEMP/personal-control/config/fork-build/packages.mjs" stage-linux personal-build/plan.json "$GITHUB_WORKSPACE" "$ORCA_LINUX_BUILD_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: personal-package-${{ matrix.id }}
          path: personal-packages/
          if-no-files-found: error
          retention-days: 14

  verify-linux:
    needs: [plan, linux]
    if: needs.linux.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - *checkout
      - *node
      - *source-plan
      - uses: actions/download-artifact@v8
        with:
          name: personal-package-${{ matrix.id }}
          path: linux-packages/${{ matrix.id }}
      - name: Install trusted archive inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio binutils
      - name: Independently extract and verify all three native packages
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TARGET_ID: ${{ matrix.id }}
        run: node config/fork-build/packages.mjs verify-linux personal-build/plan.json "linux-packages/$TARGET_ID" "$ARCHITECTURE"
      - uses: actions/upload-artifact@v7
        with:
          name: personal-package-${{ matrix.id }}-verification
          path: linux-packages/${{ matrix.id }}/${{ matrix.id }}-verified.json
          if-no-files-found: error
          retention-days: 14

  stage:
    needs: [plan, macos, verify-windows, verify-android, verify-linux]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: macos-26-intel
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - *checkout
      - *node
      - *source-plan
      - uses: actions/download-artifact@v8
        with:
          pattern: personal-package-*
          path: deliverables
      - name: Reopen both macOS archives and check the complete platform set
        run: |
          mv deliverables/personal-package-macos-arm64 personal-packages
          mv deliverables/personal-package-windows-x64 windows-packages
          mv deliverables/personal-package-android android-packages
          mkdir linux-packages
          for arch in x64 arm64; do
            mv "deliverables/personal-package-linux-$arch" "linux-packages/linux-$arch"
            mv "deliverables/personal-package-linux-$arch-verification/linux-$arch-verified.json" "linux-packages/linux-$arch/"
          done
          mv deliverables/personal-package-windows-verification/windows-verified.json windows-packages/
          mv deliverables/personal-package-android-verification/android-verified.json android-packages/
          node config/fork-build/packages.mjs verify personal-build/plan.json personal-packages
          node config/fork-build/packages.mjs assemble-release personal-build/plan.json personal-packages windows-packages android-packages linux-packages
      - name: Stage complete verified downloads as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: node config/fork-build/release-draft.mjs personal-build personal-packages

  sync:
    needs: [plan, stage]
    if: github.repository == 'gentslava/orca' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      master: ${{ steps.promote.outputs.master }}
      main: ${{ steps.promote.outputs.main }}
      observed_upstream: ${{ steps.promote.outputs.observed_upstream }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - *node
      - *source-plan
      - name: Promote verified application to master and mirror upstream to main atomically
        id: promote
        env:
          FORK_SYNC_DEPLOY_KEY: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
        run: node config/fork-build/promotion.mjs personal-build
      - name: Remove temporary SSH credentials even after cancellation
        if: always()
        run: rm -rf -- "$RUNNER_TEMP"/orca-fork-sync-ssh-*
      - name: Preserve the exact branch promotion receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: personal-branch-promotion
          path: personal-build/promotion.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [plan, sync]
    if: github.repository == 'gentslava/orca' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the staged release after successful branch promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BUILT_SOURCE: ${{ needs.plan.outputs.source }}
          PROMOTED_MASTER: ${{ needs.sync.outputs.master }}
          PROMOTED_MAIN: ${{ needs.sync.outputs.main }}
        run: |
          [[ "$RELEASE_TAG" =~ ^personal-[0-9]+-[0-9]+$ && "$BUILT_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main refs/heads/master)"
          grep -Fxq "$PROMOTED_MASTER"$'\t'refs/heads/master <<< "$refs"
          grep -Fxq "$PROMOTED_MAIN"$'\t'refs/heads/main <<< "$refs"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$BUILT_SOURCE" --draft=false --prerelease --latest=false

  status:
    needs:
      [
        plan,
        javascript,
        macos,
        windows,
        android,
        linux,
        verify-windows,
        verify-android,
        verify-linux,
        stage,
        sync,
        publish
      ]
    if: always() && github.repository == 'gentslava/orca' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !inputs.audit_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - *checkout
      - *node
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.receipt == 'true' && needs.plan.outputs.plan_artifact_id != ''
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: personal-build
      - name: Update the persistent lifecycle and last-successful-build record
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          LINUX_VERIFICATION: ${{ needs.verify-linux.result }}
          WINDOWS_VERIFICATION: ${{ needs.verify-windows.result }}
          ANDROID_VERIFICATION: ${{ needs.verify-android.result }}
          DRAFT_STAGE: ${{ needs.stage.result }}
          PUBLICATION: ${{ needs.publish.result }}
          BRANCH_SYNC: ${{ needs.sync.result }}
          PROMOTED_MAIN: ${{ needs.sync.outputs.main }}
          OBSERVED_UPSTREAM: ${{ needs.sync.outputs.observed_upstream }}
        run: |
          mkdir -p personal-build
          node config/fork-build/status.mjs personal-build

  retention:
    needs: [plan, sync, publish, status]
    if: github.repository == 'gentslava/orca' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.sync.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - *checkout
      - *node
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.plan_artifact_id }}
          path: personal-build
      - name: Keep the published release and its verified rollback
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION: ${{ needs.publish.result }}
          BRANCH_SYNC: ${{ needs.sync.result }}
        run: node config/fork-build/release-retention.mjs personal-build --apply
      - name: Preserve the release cleanup receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: personal-release-retention
          path: personal-build/release-retention.json
          if-no-files-found: warn
          retention-days: 14
